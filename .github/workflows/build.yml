name: Build Earning AI Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          unzip -q Earning_AI_Pro_Android_Project.zip -d project

      - name: Build APK
        run: |
          cd project/Earning_AI_Pro_Android_Project
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Earning-AI-Pro-debug-apk
          path: project/Earning_AI_Pro_Android_Project/app/build/outputs/apk/debug/*.apk
